<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>의료비 체커 — 본인부담상한제 환급 확인</title>

    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563EB" />

    <!--
      이 앱은 SPA라 og: 태그가 index.html 하나에 고정된다 — /checker 공유 링크의
      미리보기는 항상 이 앱 전체 카드(동적 계산 결과 아님)로 뜬다. 결과별 미리보기를
      만들려면 서버/엣지 함수가 필요한데, 이번 단계는 "백엔드 없음" 제약이라 범위 밖.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="의료비 체커" />
    <meta
      property="og:description"
      content="숫자만 입력하면 본인부담상한제 환급 여부를 1분 안에 확인할 수 있어요."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="의료비 체커" />
    <meta
      name="twitter:description"
      content="숫자만 입력하면 본인부담상한제 환급 여부를 1분 안에 확인할 수 있어요."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
